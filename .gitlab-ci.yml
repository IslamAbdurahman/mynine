stages:
  - test
  - lint
  - deploy

test_backend:
  stage: test
  image: php:8.4
  script:
    - cp .env.example .env
    - composer install
    - php artisan key:generate
    - php artisan test
  only:
    - main
    - merge_requests

lint_frontend:
  stage: lint
  image: node:22
  script:
    - npm install
    - npm run lint
    - npm run types
  only:
    - main
    - merge_requests

before_script:
  # Install SSH key
  - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client -y )'
  - eval $(ssh-agent -s)
  - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - ssh-keyscan "$SSH_HOST" >> ~/.ssh/known_hosts
  - chmod 644 ~/.ssh/known_hosts

deploy_production:
  stage: deploy
  script:
    - ssh "$SSH_USER"@"$SSH_HOST" "
      cd "$WORK_DIR"
      && git pull origin main
      && composer install
      && npm install
      && npm run build
      && php artisan migrate
      && php artisan optimize:clear"
  only:
    - main
