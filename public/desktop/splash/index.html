<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mynine Secure Exam Browser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background: radial-gradient(circle at top right, #1e1b4b 0%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 40px 32px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #4f46e5 0%, #312e81 100%);
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo-badge svg {
            width: 40px;
            height: 40px;
            fill: #ffffff;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
            background: linear-gradient(to right, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 9999px;
            font-size: 11px;
            font-weight: 600;
            color: #34d399;
            margin-bottom: 24px;
        }

        .status-pill.offline {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: currentColor;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            height: 54px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 0 18px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            outline: none;
            transition: all 0.2s;
            text-align: center;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        input::placeholder {
            color: #475569;
            font-size: 15px;
            letter-spacing: 1px;
            font-weight: 500;
            text-transform: none;
        }

        .btn-submit {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            border: none;
            border-radius: 14px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 10px 20px -5px rgba(79, 70, 229, 0.4);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            transform: translateY(-1px);
            box-shadow: 0 15px 25px -5px rgba(79, 70, 229, 0.5);
        }

        .btn-submit:active {
            transform: translateY(1px);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .footer-note {
            margin-top: 24px;
            font-size: 11px;
            color: #64748b;
            line-height: 1.5;
        }

        .exit-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .exit-btn:hover {
            color: #f87171;
            background: rgba(239, 68, 68, 0.1);
        }

        /* Loading spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Teacher Exit Icon -->
        <button class="exit-btn" id="exitBtn" title="O'qituvchi chiqish paroli">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                <line x1="12" y1="2" x2="12" y2="12"></line>
            </svg>
        </button>

        <!-- Logo -->
        <div class="logo-badge">
            <svg viewBox="0 0 24 24">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
        </div>

        <h1>Mynine Exam Browser</h1>
        <p class="subtitle">Official IELTS Computer-Delivered Assessment</p>

        <div class="status-pill" id="statusPill">
            <span class="status-dot"></span>
            <span id="statusText">Serverga ulanmoqda...</span>
        </div>

        <form id="examForm">
            <div class="input-group">
                <label for="candidateCode">Nomzod Kodi (Candidate Code)</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="candidateCode" 
                        placeholder="Masalan: TEST1-849201" 
                        maxlength="20" 
                        autocomplete="off" 
                        autofocus 
                        required
                    />
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">Imtihonni Boshlash</span>
                <div class="spinner" id="btnSpinner"></div>
            </button>
        </form>

        <p class="footer-note">
            * Dastur xavfsiz Kiosk rejimida ishlamoqda. Imtihon tugaguncha boshqa ilovalarga o'tish taqiqlanadi.
        </p>
    </div>

    <script>
        const candidateInput = document.getElementById('candidateCode');
        const examForm = document.getElementById('examForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const statusPill = document.getElementById('statusPill');
        const statusText = document.getElementById('statusText');
        const exitBtn = document.getElementById('exitBtn');

        // Force Uppercase and allow A-Z, 0-9 and hyphens (-)
        candidateInput.addEventListener('input', (e) => {
            e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, '');
        });

        // Handle online/offline events
        function updateOnlineStatus() {
            if (navigator.onLine) {
                statusPill.classList.remove('offline');
                statusText.textContent = 'Serverga ulandi (Online)';
                submitBtn.disabled = false;
            } else {
                statusPill.classList.add('offline');
                statusText.textContent = 'Internet aloqasi yo\'q (Offline)';
                submitBtn.disabled = true;
            }
        }

        window.addEventListener('online', updateOnlineStatus);
        window.addEventListener('offline', updateOnlineStatus);
        updateOnlineStatus();

        // Form Submit
        examForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const code = candidateInput.value.trim();
            if (!code) return;

            btnText.textContent = 'Yuklanmoqda...';
            btnSpinner.style.display = 'block';
            submitBtn.disabled = true;

            if (window.electronAPI) {
                window.electronAPI.openExam(code);
            } else {
                // Fallback for browser preview
                window.location.href = 'https://mynine.uz';
            }
        });

        // Teacher Exit Request
        exitBtn.addEventListener('click', () => {
            if (window.electronAPI) {
                window.electronAPI.requestExit();
            }
        });
    </script>
</body>
</html>
